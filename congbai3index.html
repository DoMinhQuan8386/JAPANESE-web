<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex & Grid Battle</title>

    <!-- Kết nối file CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BÀI 1: FLEXBOX -->
    <section class="flex-section">
        <div class="container">
            <h1>FLEXBOX</h1>
            <p>Căn giữa theo chiều ngang và chiều dọc</p>
        </div>
    </section>


    <!-- BÀI 2: CSS GRID -->
    <section class="grid-section">
        <h2>CSS GRID - 3 CỘT</h2>

        <div class="grid-container">
            <div class="column">
                <h3>Cột 1</h3>
                <p>Nội dung cột 1</p>
            </div>

            <div class="column">
                <h3>Cột 2</h3>
                <p>Nội dung cột 2</p>
            </div>

            <div class="column">
                <h3>Cột 3</h3>
                <p>Nội dung cột 3</p>
            </div>
        </div>
    </section>

</body>
</html>
