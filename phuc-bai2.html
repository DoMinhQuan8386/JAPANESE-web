<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bố cục CSS Grid 3 Cột</title>
  <link rel="stylesheet" href="grid.css">
</head>
<body>

  <!-- Wrapper căn giữa bố cục bảng ra giữa màn hình -->
  <div class="page-wrapper">
    <div class="grid-container">
      <div class="grid-card">
        <h3>Cột 1</h3>
        <p>Thẻ nội dung với nền xám nhạt và góc bo tròn 10px.</p>
      </div>

      <div class="grid-card">
        <h3>Cột 2</h3>
        <p>Khoảng cách giữa các cột được thiết lập chính xác 20px.</p>
      </div>

      <div class="grid-card">
        <h3>Cột 3</h3>
        <p>Bố cục 3 cột tỷ lệ bằng nhau hoàn hảo nhờ vào đơn vị 1fr.</p>
      </div>
    </div>
  </div>

</body>
</html>
