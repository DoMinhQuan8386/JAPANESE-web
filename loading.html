<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Indicator - Portfolio</title>
  <style>
    /* Reset & Thiết lập nền trang Portfolio sang trọng */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a; /* Nền tối hiện đại phù hợp Portfolio */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }

    /* Container chứa Loader */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* ========================================================
       VÒNG TRÒN LOADING BẰNG CSS & KEYFRAMES
       ======================================================== */
    .spinner {
      /* Kích thước & Hình dạng */
      width: 52px;
      height: 52px;
      border-radius: 50%;

      /* Đường viền nền mờ (track) */
      border: 4px solid rgba(255, 255, 255, 0.12);

      /* Điểm nhấn xoay: chỉ đổi màu border-top */
      border-top-color: #6366f1; /* Tím indigo hiện đại */

      /* Tối ưu hiệu năng rendering bằng GPU */
      will-change: transform;

      /* Áp dụng animation xoay vô hạn */
      animation: spin 0.85s linear infinite;
    }

    /* Định nghĩa chuyển động xoay 360 độ */
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Dòng chữ tải dữ liệu Portfolio */
    .loading-text {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #94a3b8;
      text-transform: uppercase;
      animation: pulse-opacity 1.7s ease-in-out infinite;
    }

    @keyframes pulse-opacity {
      0%, 100% {
        opacity: 0.5;
      }
      50% {
        opacity: 1;
      }
    }

    /* ========================================================
       CÁC BIẾN THỂ KÍCH THƯỚC (Tuỳ chọn cho Portfolio)
       ======================================================== */
    .sizes-demo {
      display: flex;
      gap: 30px;
      align-items: center;
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .spinner-sm {
      width: 24px;
      height: 24px;
      border-width: 3px;
      border-top-color: #38bdf8; /* Xanh Cyan */
    }

    .spinner-md {
      width: 44px;
      height: 44px;
      border-width: 4px;
      border-top-color: #a855f7; /* Tím Purple */
    }

    .spinner-lg {
      width: 64px;
      height: 64px;
      border-width: 5px;
      border-top-color: #10b981; /* Xanh Emerald */
    }
  </style>
</head>
<body>

  <!-- Loading Indicator chính -->
  <div class="loader-container">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải Portfolio...</div>
  </div>

  <!-- Các kích thước & màu sắc khác dùng trong từng phần của Portfolio -->
  <div class="sizes-demo">
    <div class="spinner spinner-sm" title="Size nhỏ: dùng trong nút hoặc thẻ nhỏ"></div>
    <div class="spinner spinner-md" title="Size vừa: dùng cho card dự án"></div>
    <div class="spinner spinner-lg" title="Size lớn: dùng khi tải toàn trang"></div>
  </div>

</body>
</html>
