<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2: Bố cục lưới với CSS Grid</title>
    <link rel="stylesheet" href="Khanh-bai2.css">
</head>
<body>

    <div class="wrapper">
        <h1 class="heading">Bố Cục Lưới (CSS Grid)</h1>
        
        <!-- Bố cục lưới 3 cột bằng nhau, khoảng cách 20px -->
        <div class="grid-container">
            <div class="grid-card">
                <h2>Cột 1</h2>
                <p>Thẻ 1 với màu nền xám nhạt và được bo góc 10px theo đúng yêu cầu.</p>
            </div>
            <div class="grid-card">
                <h2>Cột 2</h2>
                <p>Khoảng cách (gap) giữa các cột được thiết lập chính xác là 20px.</p>
            </div>
            <div class="grid-card">
                <h2>Cột 3</h2>
                <p>Cả 3 cột đều có kích thước bằng nhau thông qua đơn vị 1fr (fractional unit).</p>
            </div>
        </div>
    </div>

</body>
</html>
